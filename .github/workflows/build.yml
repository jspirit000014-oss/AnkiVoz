name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Descargar modelo Vosk en español
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q model.zip
          rm -rf app/src/main/assets/model
          mv vosk-model-small-es-0.42 app/src/main/assets/model
          ls app/src/main/assets/model

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AnkiVoz-debug
          path: app/build/outputs/apk/debug/app-debug.apk
